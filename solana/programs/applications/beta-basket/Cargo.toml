[package]
name = "beta-basket"
version = "0.1.0"
description = "BETA: tokens backed by a basket of up to 8 parts, one per network, on one network. Design: docs/specs/ipow-beta-app.md."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "beta_basket"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
anchor-spl = { version = "1.0.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "mint"] }

[dev-dependencies]
litesvm = "0.11.0"
anchor-litesvm = "0.4.0"
solana-program = "3.0.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
litesvm-token = "0.11.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
