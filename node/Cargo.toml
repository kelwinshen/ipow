# The iPoW node: one program that runs the roles of the protocol (operator,
# guardian, attester) on any number of networks. Spec:
# docs/design/ipow-protocol.md. The old service for the old contracts,
# core/operator, was removed; it stays in git at the tag legacy-v1.
[workspace]
members = ["crates/protocol", "crates/node", "crates/bitcoin", "crates/networks/evm", "crates/networks/svm", "crates/testing"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
