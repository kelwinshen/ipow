# The tunnel API (docs/specs/ipow-conversion-tunnel.md): only Greatwall's
# server calls it, with the key (its TUNNEL_API_URL and TUNNEL_API_KEY).
# At most 2,000 sats a tunnel: the operator pays the BTC first, from a
# wallet of a few thousand sats, keeping enough for the fee cap above.
# It opens a tunnel only when the wallet can pay it on top of those open.
# The user opens each tunnel's buy and pays its job fees; those fees are not
# priced into the quote: in test ETH they are worth nothing, and at the test
# rates they would exceed the few hundred sats of a swap.
tunnel_api:
  listen: 127.0.0.1:8787
  key_env: TUNNEL_API_KEY
  max_sats: 2000
  price_fees: false
