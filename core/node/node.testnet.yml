# The node on the test networks deployed on 2026-10-02/03 (spec Build
# status, row 8), on Sepolia and Solana devnet: as a guardian, and as an
# operator taking jobs on Sepolia, where its bond is locked (on Solana it
# waits for a bond, spending nothing). Addresses from programmable-network/ethereum/
# deployments/ethereum-testnet.json and programmable-network/solana/README.md.
# No secrets: run-testnet.sh loads the keys and endpoints this names.

roles: [operator, guardian]

bitcoin:
  explorer: https://mempool.space/api
  # mempool.space times out often from this machine; blockstream.info answers.
  fallback_explorers: [https://blockstream.info/api]
  # The operator wallet's mainnet WIF key, loaded by run-testnet.sh.
  wallet_key_env: BTC_WALLET_KEY
  # At most 10 sat/vB: the wallet holds about 14,000 sats.
  max_fee_rate: 10

interval_seconds: 30

networks:
  - name: ethereum-sepolia
    kind: evm
    rpc_env: SEPOLIA_RPC_URL
    key_env: SEPOLIA_PRIVATE_KEY
    light_client: "0x8e09508deF58997f8481FF678cd7f278DFe22C3F"
    protocol: "0x21348ef459dDBa5607732Ca1e9992968B4cC5611"
    # A challenge's deposit, at most 0.01 ETH.
    guardian: { max_deposit: "10000000000000000" }
    # At most 0.05 ETH of bond locked for one job: a checkpoint's escrow is
    # 5 times its fee, about 0.03 ETH at a base fee of 1 gwei.
    operator: { max_bid: "50000000000000000" }
    # Conversion with the tunnel (2026-10-03). Test coins have no market,
    # and Bitcoin only carries the real transaction: fixed, representative
    # rates, about a tenth of the market's; Greatwall reads them from the
    # tunnel API's /assets, so a test swap is a few hundred sats.
    # The RWA tokens are the mock ones of deployments/ethereum-testnet-rwa.json
    # (2026-10-04), priced per whole token; the operator holds 1,000 of each.
    conversion:
      address: "0x5fdFfea2E1e03E6Eb376Aa6d679A4C8b62bf6da1"
      coins:
        - { token: native, symbol: ETH, decimals: 18, pay_sats: 300000, ask_sats: 300000 }
        - { token: "0x9246Ce8312BAB79866125957240Ede78263E10aC", symbol: AAPL, decimals: 18, pay_sats: 2500, ask_sats: 2500 }
        - { token: "0x12268ABD5814bd53F52E4A7e7dee0978791048f4", symbol: TSLA, decimals: 18, pay_sats: 4000, ask_sats: 4000 }
        - { token: "0x0352eF8943B606B2613d79634D5876E7D550448B", symbol: NVDA, decimals: 18, pay_sats: 1800, ask_sats: 1800 }
        - { token: "0x75eddA253800F4718dc71fC255A5A77ff2A9fa0a", symbol: GOLD, decimals: 18, pay_sats: 40000, ask_sats: 40000 }

  - name: solana-devnet
    kind: svm
    rpc_env: SOLANA_RPC_URL
    key_env: SOLANA_KEY
    light_client: "Ctotq1SSaDJ2EUSe4sMdau92qBesyutH7GPaTRiYp4vJ"
    protocol: "ChYhovM8vm2tuMRaRFn4m6etG979bjixVa71fXBDwjPL"
    # At most 0.01 SOL.
    guardian: { max_deposit: "10000000" }
    # At most 0.02 SOL; no bond is locked on Solana yet.
    operator: { max_bid: "20000000" }
    conversion:
      address: "9Argk3M83p8t5pWG92PhwEhYzysWt5n82siEWyb29w7D"
      coins:
        # SOL only: the node's token buys, and the SDK's token swaps, are not
        # built on Solana yet (the mock tokens are in testnet-rwa.json).
        - { token: native, symbol: SOL, decimals: 9, pay_sats: 15000, ask_sats: 15000 }

# The vault pair, left out while the operator first takes jobs: its
# operator would register a pair chain on Bitcoin at once.
# vault:
#   deposits: 1
#   pairs:
#     - networks: [ethereum-sepolia, solana-devnet]
#       vaults: ["0xD18b7d290f8c94fe561710A78F17494ff2520302", "2e1ZUB5eqA6bQfH3f9pbfvibfie7WnvEJeKif53VAm7p"]
#       journal: testnet-eth-sol.journal
#       assets: []

# The tunnel API (docs/drafts/ipow-conversion-tunnel.md): only Greatwall's
# server calls it, with the key (its TUNNEL_API_URL and TUNNEL_API_KEY).
# At most 2,000 sats a tunnel: the operator pays the BTC first, from a
# wallet of about 14,000 sats, and keeps about 5,400 for the fee cap above.
# It opens a tunnel only when the wallet can pay it on top of those open.
# The user opens each tunnel's buy and pays its job fees; those fees are not
# priced into the quote: in test ETH they are worth nothing, and at the test
# rates they would exceed the few hundred sats of a swap.
tunnel_api:
  listen: 127.0.0.1:8787
  key_env: TUNNEL_API_KEY
  max_sats: 2000
  price_fees: false
