# Example settings of an iPoW node. Copy to node.yml and fill in the
# addresses. This file holds no secrets: keys and endpoints come from the
# environment variables it names (put them in .env, which git ignores).

# Any mix of: operator, guardian, attester.
roles: [guardian]

bitcoin:
  explorer: https://mempool.space/api
  # Needed only when roles include operator: a mainnet WIF key.
  # wallet_key_env: BTC_WALLET_KEY
  # The highest fee rate the wallet pays, in sat/vB (default 200).
  # max_fee_rate: 200

# Seconds between two rounds of a role on a network.
interval_seconds: 15

networks:
  - name: ethereum-sepolia
    kind: evm
    rpc_env: SEPOLIA_RPC_URL
    key_env: SEPOLIA_KEY
    light_client: "0x0000000000000000000000000000000000000000"
    protocol: "0x0000000000000000000000000000000000000000"
    # Limits in wei. Only the sections of the chosen roles are needed.
    guardian: { max_deposit: "100000000000000000" }
    # operator: { max_bid: "2000000000000000000" }
    # Conversion's swaps, for an operator: prices in satoshis per whole coin.
    # conversion:
    #   address: "0x0000000000000000000000000000000000000000"
    #   coins:
    #     - { token: native, decimals: 18, pay_sats: 3000000, ask_sats: 3100000 }
    # attester: { max_lock: "1000000000000000000" }

  - name: solana-devnet
    kind: svm
    rpc_env: SOLANA_RPC_URL
    # A JSON array of 64 bytes, as solana-keygen writes it, or base58.
    key_env: SOLANA_KEY
    light_client: "Ctotq1SSaDJ2EUSe4sMdau92qBesyutH7GPaTRiYp4vJ"
    protocol: "ChYhovM8vm2tuMRaRFn4m6etG979bjixVa71fXBDwjPL"
    # Limits in lamports.
    guardian: { max_deposit: "10000000" }

# The protocol's vault (spec section 11), for the operator and guardian
# roles: a vault per pair of networks (D132), each pair listed with its two
# networks (names from `networks`), their vaults in the same order (the
# pair's vault contract on an EVM network, the vault program on Solana), a
# journal of its own, and what to pay for a checkpoint job on each network
# (each network's smallest unit). An asset's amounts are in record units,
# the receipt's smallest unit (gwei for ETH, lamports for SOL).
# vault:
#   deposits: 5
#   pairs:
#     - networks: [ethereum-sepolia, solana-devnet]
#       vaults: ["0x0000000000000000000000000000000000000000", "2e1ZUB5eqA6bQfH3f9pbfvibfie7WnvEJeKif53VAm7p"]
#       journal: eth-sol.journal    # keep it: the batches this operator wrote
#       checkpoint_paid: ["100000000000000000", "100000000"]
#       assets:                     # what the operator carries; nothing else
#         - home: ethereum-sepolia  # ETH, asset 0 of Ethereum
#           asset: 0
#           bond_home: 2000000000   # 2 ETH on Ethereum: covers ETH locks
#           bond_receipt: 0         # vETH on Solana: covers vETH burns
#           min_fee: 0              # the least fee worth carrying
#           fast:                   # the fast paths; leave out to attest nothing
#             min_fee: 100000       # the least fast fee worth attesting or paying
#             max: 1000000000       # the largest lock or burn attested or paid
#         - home: solana-devnet     # SOL, asset 0 of Solana
#           asset: 0
#           bond_home: 5000000000   # 5 SOL on Solana: covers SOL locks
