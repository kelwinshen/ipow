[tools]
rust = "1.91.1"

[env]
_.file = ".env"

[tasks.ensure-redis]
description = "Ensure the Redis container from docker-compose is running"
run = "docker compose up -d redis"

[tasks.template]
description = "Generate .env.example and config.example.yml from current local files"
run = """
sed 's/=.*$/=/' .env > .env.example
sed 's/: .*$/: /' config.yml > config.example.yml
echo "Templates generated: .env.example, config.example.yml"
"""

[tasks.build]
description = "Build all operator binaries"
run = "cargo build --release"

[tasks.run-all]
depends = ["ensure-redis"]
description = "Usage: [PORT=8888] [ENGINE=all] mise run run-all"
run = '''
bash -c '
P_FLAG=${PORT:-8888}
E_FLAG=${ENGINE:-all}
cargo run -- monolith --port "$P_FLAG" --engine "$E_FLAG"
'
'''

[tasks.rebalance-all]
depends = ["ensure-redis"]
description = "Run rebalance engine for all supported networks"
run = "cargo run -- monolith --engine rebalance"


# --- Network Specific Helpers ---

[tasks.run-hedera]
depends = ["ensure-redis"]
description = "Usage: [ENGINE=all] [WATCH=ethereum,solana,polkadot] mise run run-hedera."
run = '''
bash -c '
E_FLAG=${ENGINE:-all}
W_FLAG=${WATCH:-ethereum,solana,polkadot}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src hedera --engine "$E_FLAG" --watch-sources "$W_FLAG"
else
    cargo run -- operator --src hedera --engine "$E_FLAG"
fi
'
'''

[tasks.run-ethereum]
depends = ["ensure-redis"]
description = "Usage: [ENGINE=all] [WATCH=hedera,solana,polkadot] mise run run-ethereum."
run = '''
bash -c '
E_FLAG=${ENGINE:-all}
W_FLAG=${WATCH:-hedera,solana,polkadot}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src eth --engine "$E_FLAG" --watch-sources "$W_FLAG"
else
    cargo run -- operator --src eth --engine "$E_FLAG"
fi
'
'''

[tasks.run-solana]
depends = ["ensure-redis"]
description = "Usage: [ENGINE=all] [WATCH=hedera,eth,polkadot] mise run run-solana."
run = '''
bash -c '
E_FLAG=${ENGINE:-all}
W_FLAG=${WATCH:-hedera,eth,polkadot}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src solana --engine "$E_FLAG" --watch-sources "$W_FLAG"
else
    cargo run -- operator --src solana --engine "$E_FLAG"
fi
'
'''

[tasks.run-polkadot]
depends = ["ensure-redis"]
description = "Usage: [ENGINE=all] [WATCH=hedera,ethereum,solana] mise run run-polkadot."
run = '''
bash -c '
E_FLAG=${ENGINE:-all}
W_FLAG=${WATCH:-hedera,ethereum,solana}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src polkadot --engine "$E_FLAG" --watch-sources "$W_FLAG"
else
    cargo run -- operator --src polkadot --engine "$E_FLAG"
fi
'
'''

[tasks.run-custom]
description = "Usage: [ENGINE=all] [WATCH=...] mise run run-custom <src>."
run = '''
bash -c '
E_FLAG=${ENGINE:-all}
W_FLAG=${WATCH:-}
SRC="$1"
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src "$SRC" --engine "$E_FLAG" --watch-sources "$W_FLAG"
else
    cargo run -- operator --src "$SRC" --engine "$E_FLAG"
fi
' -- "$@"
'''

[tasks.run-api]
depends = ["ensure-redis"]
description = "Usage: [PORT=8888] mise run run-api"
run = '''
bash -c '
P_FLAG=${PORT:-8888}
cargo run -- api --port "$P_FLAG"
'
'''

# --- Docker & CI/CD ---

[tasks.docker-build]
description = "Build Docker image"
run = "docker build -t renrensan/ipow-interoperability-service-v2 ."

[tasks.docker-push]
description = "Push to dockerhub repository"
run = "docker push renrensan/ipow-interoperability-service-v2"

# --- Quality Control ---

[tasks.fmt]
description = "Check Rust code formatting"
run = "cargo fmt"

[tasks.clippy]
description = "Run Rust linter"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint]
description = "Run all Rust linters"
depends = ["fmt", "clippy"]

[tasks.stream-solana]
depends = ["ensure-redis"]
description = "Usage: [WATCH=hedera,eth] mise run stream-solana (Runs ONLY the Streamer engine)"
run = '''
bash -c '
W_FLAG=${WATCH:-hedera,eth}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src solana --engine streamer --watch-sources "$W_FLAG"
else
    cargo run -- operator --src solana --engine streamer
fi
'
'''

[tasks.convert-solana]
depends = ["ensure-redis"]
description = "Usage: [WATCH=hedera,eth] mise run convert-solana (Runs ONLY the Converter engine)"
run = '''
bash -c '
W_FLAG=${WATCH:-hedera,eth}
if [ -n "$W_FLAG" ]; then
    cargo run -- operator --src solana --engine converter --watch-sources "$W_FLAG"
else
    cargo run -- operator --src solana --engine converter
fi
'
'''

[tasks.rebalance-hedera]
depends = ["ensure-redis"]
description = "Run rebalance engine for Hedera"
run = "cargo run -- operator --src hedera --engine rebalance"

[tasks.rebalance-ethereum]
depends = ["ensure-redis"]
description = "Run rebalance engine for Ethereum"
run = "cargo run -- operator --src eth --engine rebalance"

[tasks.rebalance-solana]
depends = ["ensure-redis"]
description = "Run rebalance engine for Solana"
run = "cargo run -- operator --src solana --engine rebalance"

[tasks.rebalance-polkadot]
depends = ["ensure-redis"]
description = "Run rebalance engine for Polkadot"
run = "cargo run -- operator --src polkadot --engine rebalance"