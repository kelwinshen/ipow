[package]
name = "ipow-operator"
version = "0.1.0"
edition = "2024"

[dependencies]
ipow-core = { path = "../core" }
ipow-evm-revm = { path = "../network-vm/evm-revm" }
ipow-svm = { path = "../network-vm/svm" }
ipow-operator-api = { path = "../api" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
clap = { version = "4.5.54", features = ["derive"] }
ethers-core = "2.0.14"
ethers = "2.0.14"
once_cell = "1.21.3"
futures = "0.3.31"
chrono = "0.4.43"
axum = "0.8.8"
bitcoin = "0.32.8"
reqwest = { version = "0.13.1", features = ["json"] }
hex = "0.4.3"
