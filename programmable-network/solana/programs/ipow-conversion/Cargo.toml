[package]
name = "ipow-conversion"
version = "0.1.0"
description = "Value-moving Native<->Bitcoin conversion, split out as its own program (mirrors the ipow-message-relay split) so it can be CPI-composed into other programs (e.g. a future cross-network minting program) without dragging in ipow's header-relay/operator-eligibility surface. Reads ipow's existing header relay directly (cross-program Account<> reads), never writes to it. Replaces the single-fixed-operator Conversion that still lives, unmodified, inside ipow: the claiming role here is a permissionless windowed staked auction (ipow-message-relay's propose_claim/finalize_claim/reclaim_expired_message mechanics, grafted onto Conversion's own deposit/proof/refund flow). State is already shaped per-mint (Conversion.token_mint, per-mint Pool) for a planned SPL-token follow-up; this pass itself only wires up native SOL. See docs/design/ipow-implementation.md."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ipow_conversion"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", default-features = false, features = ["token", "token_2022", "associated_token"] }
sha2 = "0.11.0"
ipow = { path = "../ipow", features = ["no-entrypoint"] }

[dev-dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
litesvm = "0.11.0"
litesvm-token = { version = "0.11.0", features = ["token-2022"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "2.1.0"
anchor-litesvm = "0.4.0"
solana-program = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"
solana-clock = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
