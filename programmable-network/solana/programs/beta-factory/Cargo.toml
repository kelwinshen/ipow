[package]
name = "beta-factory"
version = "0.1.0"
description = "BETA v2 factory (docs/DESIGN_V2.md §6): one fungible BETA on Solana backed by SOL held here and ETH held in BetaVault.sol on Ethereum. Cross-chain claims travel as Bitcoin transactions on each registered party's statement chain; this program judges the claims that are about Solana facts (burns, pending locks), acts provisionally on the ones about Ethereum (mints, rate-limited and vetoable), and slashes bonds it holds. Reads ipow's header relay read-only, like ipow-conversion."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "beta_factory"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "mint", "associated_token"] }
sha2 = "0.11.0"
ipow = { path = "../ipow", features = ["no-entrypoint"] }

[dev-dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
litesvm = "0.11.0"
litesvm-token = "0.11.0"
spl-associated-token-account-interface = "2.0.0"
anchor-litesvm = "0.4.0"
solana-program = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"
solana-clock = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
