[workspace]
# Listed by name, not "programs/*": a removed program's git-ignored files
# (its target/ keypair) can stay on disk without being a member.
members = [
    "programs/beta-basket",
    "programs/conversion",
    "programs/ipow-light-client",
    "programs/ipow-protocol",
    "programs/ipow-vault",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
