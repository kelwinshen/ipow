name: check

on:
  push:
    branches: [dev, master]
  pull_request:

env:
  # The Solana CLI the programs are built and tested with locally.
  SOLANA_VERSION: v3.1.10

jobs:
  ethereum:
    name: contracts (evm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile + test (local network only, no live RPC/keys needed)
        run: pnpm --dir evm test

  solana:
    name: solana programs (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The litesvm tests load the built programs: the production builds in
      # target/deploy, and the test builds (feature test-limits) of the light
      # client and the vault in target/deploy-test. Built at their declared
      # ids; no program keypair is needed or kept. One program at a time: a
      # workspace build unifies features, and the programs' dependents enable
      # no-entrypoint on the programs they call, which empties those builds.
      - name: Build the programs
        working-directory: solana
        run: |
          for p in protocol/ipow-light-client protocol/ipow-protocol protocol/ipow-vault applications/conversion applications/beta-basket; do
            cargo build-sbf --manifest-path programs/$p/Cargo.toml
          done
          cargo build-sbf --manifest-path programs/protocol/ipow-light-client/Cargo.toml --features test-limits --sbf-out-dir target/deploy-test
          cargo build-sbf --manifest-path programs/protocol/ipow-vault/Cargo.toml --features test-limits --sbf-out-dir target/deploy-test

      - name: Test
        working-directory: solana
        run: cargo test --workspace

      - name: Keep the built programs for the node and SDK jobs
        uses: actions/upload-artifact@v4
        with:
          name: solana-programs
          path: |
            solana/target/deploy/*.so
            solana/target/deploy-test/*.so
          if-no-files-found: error

  node:
    name: node (cargo build + test)
    needs: solana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The node's tests start Hardhat from evm.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Get the built programs
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node

      - name: Build
        working-directory: node
        run: cargo build --workspace

      - name: Test
        working-directory: node
        run: cargo test --workspace

  sdk:
    name: sdk (build + test)
    needs: solana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The Solana tests run a local validator with the built programs.
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Get the built programs
        uses: actions/download-artifact@v4
        with:
          name: solana-programs
          path: solana/target

      - name: Build
        run: pnpm --dir sdk build

      - name: Test
        run: pnpm --dir sdk test
